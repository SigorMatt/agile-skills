name: answer-questions
version: 0.6.3
persona: architect
purpose: Answer downstream skills' open questions from the record, propagate each answer into the authoritative artifacts, and escalate only when required.

when_to_use:
  - An item sits at status awaiting-answer with an open blocking question.
  - Open questions addressed to the architect exist on any item.
  - A human has just answered an escalated question - or deferred it - and the reply must reach the artifacts.
  - Someone asks to "answer the open questions", "unblock", or "triage the questions" in a workspace.

dispatch:
  on_status: [awaiting-answer]
  item_types: [work-item, bug, epic]

human_interaction: direct

inputs:
  - path: tracker/items/{{item.id}}/questions/
    required: true
    why: the questions to triage, with the asker's context, options and recommendation
  - path: tracker/items/{{item.id}}/item.md
    required: true
    why: the acceptance criteria an answer may have to amend
  - path: tracker/items/{{item.id}}/artifacts/plan.md
    required: false
    why: most answers land here, and an answer that does not reach an artifact has not been given; it also carries the invalidation set, which is where a document this answer changes or falsifies is accounted for while the item is mid-flight
  - path: tracker/items/{{item.id}}/history.md
    required: true
    why: carries the resume-to status the item must be returned to
  - path: docs/architecture/adr/
    required: true
    why: an answer that contradicts a recorded decision is an escalation, not an answer
  - path: docs/product/
    required: false
    why: intent recorded at intake or refinement often already answers the question
  - path: "every document this answer must be propagated into"
    required: false
    why: an answer that does not reach the document the asker will re-read has not been given, and the sentence it lands in carries the obligation of its claim kind - a citation that resolves, or, for a claim over a family, the enumeration
  - path: tracker/items/*/artifacts/refinement-qa.md
    required: false
    why: the human may have already answered this during refinement

outputs:
  - path: tracker/items/{{item.id}}/questions/Q-###.md
    kind: file
    when: always
  - path: tracker/items/{{item.id}}/artifacts/plan.md
    kind: file
    when: conditional
  - path: tracker/items/{{item.id}}/item.md
    kind: file
    when: always
  - path: docs/architecture/adr/ADR-####-{{item.id}}.md
    kind: file
    when: conditional
  - path: "the documents this answer is propagated into - docs/product/, docs/architecture/overview.md, docs/process/ - each with a version bump and a change-log row"
    kind: file
    when: conditional
  - path: tracker/items/WI-####/
    kind: file
    when: conditional
  - path: "a commit of the workspace files this execution wrote"
    kind: commit
    when: on-success
  - path: tracker/items/{{item.id}}/journal.md
    kind: append
    when: always
  - path: tracker/items/{{item.id}}/history.md
    kind: append
    when: on-success

quality_gates:
  - name: answer-is-propagated
    description: Every answered question names the files it changed, and those files were actually changed.
    manual_check: For each question answered, open each file named in its Consequences section and confirm the change is there. A Consequences section naming no file fails this gate.
    enforcement: hard
    on_failure: stay
  - name: answered-from-the-record
    description: The answer is grounded in documents, not invented.
    manual_check: For each answer, cite the document, ADR, or Q&A entry it follows from - or state explicitly that the record was silent and record the new decision as an ADR.
    enforcement: hard
    on_failure: stay
  - name: escalation-is-justified
    description: A question passed to the human meets one of the four escalation conditions.
    manual_check: For each question re-addressed to human, name which condition in spec/question.md section 4 applies. Effort is not a condition.
    enforcement: hard
    on_failure: stay
  - name: propagated-claims-carry-their-obligation
    description: A quantified claim this execution wrote into a document - every, all, no, the only - carries an enumeration entry in the question's Consequences, written as Enumeration with Set, Enumerated by, Members and Verdict beneath it. Opening what the sentence cites does not discharge it. The citation half of this obligation belongs to the claims and workspace checks and is not re-decided here; a universal phrased without one of the quantifier words is caught by nothing.
    command: "scripts/lint-documents --rule propagated-claims-carry-their-obligation --item {{item.id}} --uncommitted"
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: engagement-state-is-left-to-the-ending
    description: The Engagement state section of every document this execution touched is byte-identical to the one it started from, opening a new one included. Those sentences are the ending's. Where an answer you propagated made one false, record it - the question's Consequences names the document and its section, and where the item has a plan the row goes into the invalidation set disposed owned-by-ending - and leave it.
    command: "scripts/lint-documents --rule engagement-state-is-left-to-the-ending --uncommitted"
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: cross-answer-consistency
    description: Every human answer this execution consumed records what it was checked against, and a declared conflict was put to its author rather than settled here.
    command: "scripts/lint-answers --item {{item.id}}"
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: workspace-valid
    description: The tracker and docs still satisfy the schemas after propagation.
    command: scripts/validate-workspace
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: item-resumed-correctly
    description: The item returned to the status recorded in resume-to, not to a guessed one.
    manual_check: Compare the new history row's target status with the resume-to value on the row that suspended the item. They must match.
    enforcement: hard
    on_failure: stay
  - name: a-deferral-is-not-an-answer
    description: A reply of "not yet" is recorded as a deferral and the item is parked, or it is enough to decide on and the question is answered citing it. Never both, never neither.
    manual_check: For each question whose reply defers rather than answers - state which move you took. If you marked it answered, quote the deferral and say what it settled. If you marked it deferred, a work item or bug must be at blocked and an epic must be back at open, with what would unblock it in Consequences either way. A deferral recorded as an answer overstates what was settled; one left open deadlocks the loop; and an epic parked at blocked is a move only review-close may make (F-050).
    enforcement: hard
    on_failure: stay

escalation:
  question: When the record cannot settle it, re-address the question to human, keep it open, state which escalation condition applies, and stop the loop rather than guessing.
  defect: If a question reveals that delivered behaviour is wrong, file a bug item; do not fix it inside the answer. If an answer widens the scope, file the implied work as a work-item at draft with arose-from naming the question - it is this skill that observed the need for it (spec/ids-and-statuses.md section 5).
  impasse: If the human is unavailable and the question is blocking, leave the item at awaiting-answer and report it. An unanswerable question is not a reason to unblock the item.

exit_criteria:
  - Every human answer this execution consumed carries a Cross-answer check naming the prior recorded human answers it was checked against - or none, with the reason - and a verdict for each (ADR-0008).
  - Every conflict a cross-answer check declares is matched by a question addressed to the human that quotes both answers by ID; none was resolved by editing a document instead.
  - Every question this execution handled is either answered with consequences, deferred with what would unblock it recorded and the item where the deferral puts it - blocked for a work item or bug, open for an epic - or addressed to the human with the condition stated.
  - Work an answer implied and no item records exists as a work-item at draft, with arose-from naming the question.
  - Every file named in a Consequences section actually contains the change.
  - Every claim this execution wrote into a document carries what its kind owes - a resolving citation for a cited fact, and for a quantified claim the set, the enumeration with its command's output, the members and a verdict per member (spec/doc-header.md section 4a).
  - No Engagement state section was written or amended. Where an answer falsified one, the question's Consequences names the document and its section and records that the ending owns it, and the item's plan, where it has one, carries the entry disposed owned-by-ending.
  - Every document this execution wrote on an item's branch is accounted for in that item's invalidation set, so the set still names every path under docs/ in the branch diff (spec/dor-dod.md D7).
  - Items whose blocking questions are all resolved are returned to their recorded resume-to status.
  - Any new decision is recorded as an ADR, cited from the question.
  - The journal entry and the history row for this execution are written.

next_status: null
failure_status: blocked
