name: intake
version: 0.3.0
persona: product-analyst
purpose: Turn a raw idea from a human into an epic and a first set of work items in the tracker.

when_to_use:
  - The orchestrator routed an open stakeholder request under tracker/requests/.
  - A human has described something they want built and no epic exists for it yet.
  - The workspace has no tracker directory and work is about to start.
  - A human proposes a second, unrelated body of work in a project that already has a tracker.
  - Someone asks to "start", "kick off", or "set up" a piece of work from an idea.

dispatch:
  on_status: []
  item_types: []

human_interaction: direct

inputs:
  - path: "the human's stated idea, in this session"
    required: false
    why: this skill exists to convert it; there is no artifact to read it from yet
  - path: tracker/requests/
    required: false
    why: a stakeholder request dispatched by next is this execution's input instead of a spoken idea
  - path: tracker/project.yaml
    required: false
    why: an existing project's name, trunk branch and commands constrain what can be proposed
  - path: tracker/items/*/item.md
    required: false
    why: existing items reveal overlap, and the highest allocated IDs
  - path: docs/product/vision.md
    required: false
    why: a new epic must be coherent with an existing product vision, or explicitly revise it

outputs:
  - path: tracker/items/{{item.id}}/questions/Q-###.md
    kind: file
    when: always
  - path: tracker/
    kind: file
    when: conditional
  - path: tracker/items/{{item.id}}/item.md
    kind: file
    when: always
  - path: docs/product/vision.md
    kind: file
    when: always
  - path: "a commit of the workspace files this execution wrote"
    kind: commit
    when: on-success
  - path: tracker/items/{{item.id}}/journal.md
    kind: append
    when: always
  - path: tracker/items/{{item.id}}/history.md
    kind: append
    when: always
  - path: tracker/board.md
    kind: file
    when: always

quality_gates:
  - name: workspace-valid
    description: The tracker and docs this skill created satisfy the workspace schemas.
    command: scripts/validate-workspace
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: epic-has-success-measures
    description: The epic states observable signals that would show the goal was met.
    manual_check: Read the epic's Success measures section; each entry must be something a person could check, not a restatement of the goal.
    enforcement: hard
    on_failure: stay
  - name: an-open-question-was-asked
    description: The stakeholder was asked one question that was not about our agenda, and it is on file.
    command: "scripts/lint-answers --item {{item.id}} --require-elicitation"
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: items-are-separable
    description: Each created work item is deliverable on its own, in some order.
    manual_check: For each item, state the order it could be built in and what it depends on; an item that cannot be described this way is really part of another.
    enforcement: advisory
    on_failure: stay
  - name: no-solution-in-the-problem
    description: The epic and items describe outcomes, not an implementation the human never asked for.
    manual_check: Read each title and story back; if it names a technology or a data structure the human did not, remove it and record what was removed.
    enforcement: advisory
    on_failure: stay

escalation:
  question: Ask the human directly, in batches, before creating anything. Only file a question artifact when the human has left the session and the answer can wait.
  defect: Not applicable; this skill creates work, it does not evaluate delivered behaviour.
  impasse: If the idea cannot be shaped into an epic with even one observable success measure, create nothing, and report to the human what is missing.

exit_criteria:
  - An epic exists at status open with a goal, success measures, and an explicit out-of-scope list.
  - One kind elicitation question exists on the epic - addressed to human, non-blocking - asking what else matters to them that nobody asked about, and its answer is recorded or it is still open with the stakeholder.
  - At least one work item exists at status draft, each naming the epic.
  - docs/product/vision.md exists and states who the product is for and what it is for.
  - Every created item has journal.md and history.md with a creation entry.
  - The board has been regenerated and shown to the human.

next_status: draft
failure_status: null
