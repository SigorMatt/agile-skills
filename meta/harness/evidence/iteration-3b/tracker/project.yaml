# Machine-readable project facts. Skills resolve {commands.*} and {conventions.*} from here.
# A null command is honest: it means the project has none yet, and the matching gate is recorded
# as skipped rather than passed. `plan` is responsible for filling these in.

project:
  name: mdtab-3b
  trunk-branch: main
  description: "A stdin-to-stdout filter that pretty-aligns markdown tables and leaves\n    everything else byte-identical."

commands:
  # Set by `plan` for WI-0001. Neither installs anything: no linter is available in this
  # environment and ADR-0001 forbids adding a dependency, so `lint` is a stdlib syntax check.
  # `test` exits 5 when no test ran, so it cannot pass an empty suite (verified 2026-08-29).
  test: "python3 -m unittest discover -s tests -t ."
  lint: "python3 -m compileall -q -x '(^|/)\\.claude(/|$)' ."
  build: null

conventions:
  branch-prefix: wi/
  commit-subject: "<scope>: <summary> (refs <ITEM-ID>)"
