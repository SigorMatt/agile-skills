name: review-close
version: 0.9.1
persona: reviewer
purpose: Review the change and its record against the Definition of Done, then merge and close the item, or reject it with reasons.

when_to_use:
  - An item sits at status in-review after verification passed.
  - A change is ready to merge and needs a Definition of Done check first.
  - An engagement has reached rest - every child stopped, nothing open - and the epic must be ended through the stakeholder.
  - scripts/engagement-state reports abandoned on an epic - the stakeholder has not answered for the threshold number of silent rounds and the ending is E4 by silence.
  - Someone asks to "review", "close", "merge", "sign off", or "wrap up" a tracked item or an epic.

dispatch:
  on_status: [in-review]
  item_types: [work-item, bug, epic]

human_interaction: via-questions

inputs:
  - path: tracker/items/{{item.id}}/item.md
    required: true
    why: the criteria, their tick state, and the outcome to be recorded
  - path: tracker/items/{{item.id}}/artifacts/verify-report.md
    required: true
    why: the evidence behind each tick, and the declared gaps
  - path: tracker/items/{{item.id}}/artifacts/impl-report.md
    required: true
    why: declared deviations from the plan, which the review must judge
  - path: tracker/items/{{item.id}}/artifacts/plan.md
    required: true
    why: the design the change is reviewed against, and the enumerated set D7 confirms against - the invalidation set, deliverable-documents and binding-adrs
  - path: tracker/items/{{item.id}}/journal.md
    required: true
    why: the Definition of Done includes the completeness of the record itself
  - path: tracker/items/{{item.id}}/history.md
    required: true
    why: a gap in the chain means a status changed outside a skill
  - path: "the diff of {{item.branch}} against {{trunk}}"
    required: true
    why: the review judges the change, not the description of it
  - path: docs/architecture/adr/
    required: false
    why: the change must not silently contradict a recorded decision, and D13 asks whether the plan's binding-adrs named every ADR this change engages
  - path: "every Engagement state section in docs/"
    required: false
    why: at an ending they are all restated, from the ending being recorded, once the ending is determined - at E4 by silence there is no answer to wait for
  - path: "scripts/engagement-state {{item.id}}"
    required: false
    why: on an epic, whether the engagement is at rest or abandoned - the same function the termination gate reads, so the two cannot disagree
  - path: tracker/waiting/{{item.id}}.md
    required: false
    why: at E4 by silence, the halts the ending statement reports - how many rounds, what was surfaced on each, and the first round's timestamp. Read only; a reader that recorded would advance the clock by consulting it

outputs:
  - path: tracker/items/{{item.id}}/artifacts/review.md
    kind: file
    when: always
  - path: tracker/items/{{item.id}}/item.md
    kind: file
    when: always
  - path: "merge of {{item.branch}} into {{trunk}}"
    kind: commit
    when: on-success
  - path: "docs/ - a correction inside this item's invalidation set at an item close, and at an ending every Engagement state section, restated"
    kind: file
    when: conditional
  - path: tracker/items/EP-###/item.md
    kind: file
    when: conditional
  - path: tracker/items/EP-###/questions/Q-###.md
    kind: file
    when: conditional
  - path: "tracker/items/*/questions/Q-###.md - at E4 by silence, every question still open in the engagement closed as abandoned with an EMPTY Answer"
    kind: file
    when: conditional
  - path: "tracker/items/*/item.md - at E4 by silence, every orphan moved to blocked with no outcome at all"
    kind: file
    when: conditional
  - path: tracker/items/BUG-####/
    kind: file
    when: conditional
  - path: tracker/items/{{item.id}}/journal.md
    kind: append
    when: always
  - path: tracker/items/{{item.id}}/history.md
    kind: append
    when: always

quality_gates:
  - name: definition-of-done
    description: Every Definition of Done criterion is evaluated individually and recorded - section 3 at an item close, section 4 at an engagement's ending.
    manual_check: Walk spec/dor-dod.md section 3 criterion by criterion at an item close, and section 4 at an ending, recording pass or fail for each with its evidence. A single overall verdict does not satisfy this gate. D7 is a confirmation against the plan's invalidation set - every entry disposed, plus the one question the set cannot answer for itself - and D13 asks whether binding-adrs named every ADR this change engages; conformance per ADR is verify's verdict, already in verify-report.md, and is not re-decided here.
    enforcement: hard
    on_failure: stay
  - name: engagement-state-is-restated
    description: At an ending, every Engagement state section in the document set is named in review.md's Sections restated at the ending. At an item close the command reports NOT APPLICABLE, which is journaled in those words and never as passed. Whether a restatement is true, and whether it was written after the sign-off answer arrived, are reads this gate does not make.
    command: "scripts/lint-documents --rule engagement-state-is-restated --item {{item.id}} --context {{item.type}}"
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: verification-postdates-the-code
    description: The verification ran against the final state of the branch, not an earlier one.
    command: "scripts/check-verify-freshness {{item.id}} {{item.branch}}"
    expect: exit-zero
    enforcement: hard
    on_failure: verifying
  - name: commits-reference-the-item
    description: Every commit on the branch carries the item ID.
    command: "scripts/check-commit-refs {{item.id}} {{item.branch}}"
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: tests-pass-on-the-merge-result
    description: The project's test command passes after merging, not only on the branch.
    command: "{{commands.test}}"
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: workspace-valid
    description: The tracker and docs satisfy the schemas after closing.
    command: scripts/validate-workspace
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: record-is-reconstructible
    description: A reader with only the tracker, docs and git log could reconstruct what happened and why.
    manual_check: Answer, using only those sources - what was built and why, which decisions were made and by which skill, what questions arose and how they were resolved, what verification found. Any answer you cannot give is a defect in the record, not in the reader.
    enforcement: hard
    on_failure: stay
  - name: claims-are-sourced
    description: Every absolute claim this execution wrote into docs/ cites something that exists, and every citation resolves.
    command: scripts/lint-claims --context {{item.type}} --changed-since {{trunk}}
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: cross-answer-consistency
    description: Every human answer in scope records what it was checked against, a declared conflict reached its author, and nothing repaired one of their sentences instead of asking.
    command: scripts/lint-answers --context {{item.type}} --changed-since {{trunk}}
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: epic-sign-off
    description: No engagement ends until the stakeholder has been asked what was delivered and what was not, after the engagement reached rest, and has replied - or, at E4 by silence, until the ask stood unanswered for the threshold and the Ending statement in review.md names every child. Ending while never having asked stays illegal in both forms.
    command: scripts/check-epic-signoff {{item.id}}
    expect: exit-zero
    enforcement: hard
    on_failure: stay

escalation:
  question: File tracker/items/{{item.id}}/questions/Q-###.md addressed to architect when the change contradicts a recorded decision and it is unclear which should give way. Set the item to awaiting-answer with resume-to in-review and stop. On an epic at rest, file the kind sign-off question addressed to human and suspend the epic to awaiting-answer with resume-to open.
  defect: A defect in this item's own delivery sends it back to in-progress with reasons. A defect elsewhere, noticed during review, becomes a bug item this skill files at ready, recording found-in or arose-from - it is the skill that observed the need for it (spec/ids-and-statuses.md section 5).
  impasse: If the item cannot be merged for reasons outside the change itself, set it to blocked with what was tried. On an epic, the impasse is an ENDING - it is recorded only after the stakeholder has been asked and has replied.

exit_criteria:
  - Every Definition of Done criterion is recorded as passed, or the item was rejected.
  - The claims audit ran over a scope that could contain something - the item's own diff at an item close, the whole document set at an ending. A gate that examined nothing is a failure, never a pass (F-066).
  - Any true-but-unsourced claim found in a standing ADR was repaired through its append-only Corrections section rather than left as an accepted gap (doc-header.md section 4b).
  - D7 was confirmed against the plan's invalidation set, not rediscovered - every entry carries a disposition, every entry disposed to-update was updated with a version bump and a change-log row, and the answer to did this change falsify a document the set does not name is recorded with what was read to reach it.
  - The plan's binding-adrs list is complete - the change engages no ADR the list does not name, and each listed ADR already carries verify's conformance verdict (spec/dor-dod.md D13).
  - At an ending, every Engagement state section in the workspace was restated after the ending was determined - which at E1 to E3 is when the sign-off answer arrived and at E4 by silence is when the threshold was reached, because no answer arrives there; at an item close, none was touched (spec/doc-header.md section 4a, ADR-0010 section 4.3 as amended by ADR-0011).
  - review.md states what was examined, not only the verdict.
  - The branch is merged into the trunk and the item is done with an outcome recorded.
  - If the engagement reached rest, the stakeholder was asked - a kind sign-off question naming every child item - or, their reply already being in the file, the ending was recorded on the epic.
  - If scripts/engagement-state reported abandoned, the ending recorded is E4 by silence - every orphan at blocked with a reason beginning "orphaned by E4:" and NO outcome, every question still open closed as abandoned with an EMPTY Answer, and the Ending statement written into review.md and mirrored in the epic's Notes.
  - An engagement this execution ended carries one of the four endings and an outcome that does not overclaim what was delivered.
  - The journal entry and the history row for this execution are written.

next_status: done
failure_status: in-progress
