name: verify
version: 0.5.1
persona: qa-engineer
purpose: Independently decide whether an item meets its acceptance criteria, with evidence, and file bugs for what is wrong.

when_to_use:
  - An item sits at status verifying and its implementation reports itself complete.
  - Someone needs an independent check that acceptance criteria are actually met, not just claimed.
  - A defect needs filing against behaviour that was already delivered.
  - Someone asks to "verify", "test", "QA", or "check this actually works" for a tracked item.

dispatch:
  on_status: [verifying]
  item_types: [work-item, bug]

human_interaction: via-questions

inputs:
  - path: tracker/items/{{item.id}}/item.md
    required: true
    why: the acceptance criteria are the only standard this skill judges against
  - path: tracker/items/{{item.id}}/artifacts/impl-report.md
    required: true
    why: the claimed evidence, which this skill checks rather than trusts
  - path: tracker/items/{{item.id}}/artifacts/plan.md
    required: true
    why: deviations from the plan are where undeclared behaviour hides, and the plan carries the binding-adrs this change is judged against and the invalidation set whose dispositions this skill checks
  - path: docs/architecture/adr/
    required: true
    why: an ADR named in binding-adrs is read here, in full, because a conformance verdict quotes the clause of its Decision that the change satisfies or breaks
  - path: "every document named in the plan's invalidation set"
    required: false
    why: an entry disposed verified-still-true is true only if someone reopened the sentence; this skill is that someone, and it repairs nothing
  - path: tracker/items/{{item.id}}/artifacts/refinement-qa.md
    required: false
    why: settles what a criterion meant when its wording is contested
  - path: "the code on branch {{item.branch}}"
    required: true
    why: verification runs against the branch head, not against a description of it
  - path: tracker/project.yaml
    required: true
    why: the commands the gates run

outputs:
  - path: tracker/items/{{item.id}}/artifacts/verify-report.md
    kind: file
    when: always
  - path: tracker/items/{{item.id}}/item.md
    kind: file
    when: always
  - path: tracker/items/BUG-####/item.md
    kind: file
    when: conditional
  - path: "a commit of the workspace files this execution wrote"
    kind: commit
    when: on-success
  - path: tracker/items/{{item.id}}/journal.md
    kind: append
    when: always
  - path: tracker/items/{{item.id}}/history.md
    kind: append
    when: always

quality_gates:
  - name: tests-pass
    description: The project's own test command passes on the branch head, run by this skill rather than reported by another.
    command: "{{commands.test}}"
    expect: exit-zero
    enforcement: hard
    on_failure: escalate
  - name: lint-clean
    description: The project's own lint command passes on the branch head.
    command: "{{commands.lint}}"
    expect: exit-zero
    enforcement: hard
    on_failure: escalate
  - name: workspace-valid
    description: The tracker still satisfies the schemas after this skill's writes.
    command: scripts/validate-workspace
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: every-criterion-independently-checked
    description: Each acceptance criterion was exercised by this skill, not accepted from the implementation report.
    manual_check: For each AC, record the command this skill ran and its actual output. Citing the implementation report as evidence fails this gate.
    enforcement: hard
    on_failure: stay
  - name: negative-cases-exercised
    description: The stated failure and boundary behaviours were actually triggered.
    manual_check: For each criterion describing an error, an empty input, or a boundary, record the command that produced that condition and what happened.
    enforcement: hard
    on_failure: stay
  - name: a-criterion-about-criteria-is-read
    description: A criterion whose subject is other criteria was assessed against their text, not against the suite's silence.
    manual_check: For each criterion of the form "the earlier criteria still hold", name every criterion it covers by ID and state, per criterion, whether its sentence is still true of the new behaviour. Record the tests as evidence for that answer. Where nothing executable exercises the old criterion and the new behaviour together, say so in those words and either add a case or waive it by name. "The suite is green" answers a different question (spec/dor-dod.md, F-065).
    enforcement: hard
    on_failure: stay
  - name: adr-conformance-is-decided
    description: Every ADR the plan names as binding carries a verdict in the verification report - conforms, violates or not-engaged - and a conforms verdict quotes a clause and names a file and line. Whether the verdict is right is a read, and a verdict for an ADR the plan does not name is recorded as a warning, because finding one the plan missed is the honest move and evidence that binding-adrs was incomplete.
    command: "scripts/lint-documents --rule adr-conformance-is-decided --item {{item.id}}"
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: invalidation-set-is-disposed
    description: Every entry in the plan's invalidation set carries a disposition and has a row in verify-report.md's Invalidation set section. Whether a verified-still-true entry is TRUE is this skill's read, recorded in that row; the gate decides only that the entry was disposed and reopened.
    command: "scripts/lint-documents --rule invalidation-set-is-disposed --item {{item.id}}"
    expect: exit-zero
    enforcement: hard
    on_failure: stay
  - name: tests-would-fail-without-the-change
    description: The tests demonstrating each criterion are sensitive to the behaviour they claim to test.
    manual_check: For at least one test per criterion, confirm it fails when the behaviour is disabled or reverted, and record how that was confirmed.
    enforcement: advisory
    on_failure: stay

escalation:
  question: File tracker/items/{{item.id}}/questions/Q-###.md addressed to architect when a criterion is ambiguous and the record does not settle it. Set the item to awaiting-answer with resume-to verifying and stop. Never ask the human directly.
  defect: A failure of this item's own criteria sends the item back to in-progress. A failure of behaviour delivered by another item is a new bug item at status ready, with reproduction steps, real output, and found-in.
  impasse: If verification cannot be performed at all - the code will not run, the environment is unusable - set the item to blocked with what was tried.

exit_criteria:
  - A criterion whose subject is other criteria names them by ID and carries a per-criterion verdict read from their text, with any non-intersection stated and a covering case added or waived by name.
  - Every acceptance criterion has a verdict backed by a command this skill ran and its actual output.
  - Every criterion that passed is ticked in item.md, and no criterion is ticked without evidence.
  - Failures are recorded as a send-back for this item's own criteria, or as bug items for behaviour delivered elsewhere.
  - Every ID in the plan's binding-adrs list has a conformance verdict in verify-report.md - conforms with the Decision clause quoted and the file and line that satisfies it, violates as a send-back, or not-engaged with the reason (spec/dor-dod.md D13).
  - Every entry in the plan's invalidation set carries a disposition, and every entry claiming a document is still true was reopened and read against the branch head.
  - This execution wrote no document under docs/. A document it found wrong is a question or a send-back - an execution that may repair what it judges has made the judgement circular (spec/doc-header.md section 5).
  - verify-report.md records the verdicts, the gates, and the defects found.
  - The journal entry and the history row for this execution are written.

next_status: in-review
failure_status: in-progress
