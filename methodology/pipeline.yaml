# pipeline.yaml — the status graph and the dispatch rules.
#
# This file is the orchestrator's entire world model. `next` reads it and the tracker, and
# knows nothing else: no engineering, no heuristics, no special cases per skill.
#
# Normative prose lives in spec/ids-and-statuses.md. This file is the machine-readable form of
# it, and scripts/lint-skills fails the build when the two disagree.

version: 0.10.0

item_types:
  - epic
  - work-item
  - bug

# Registry of the skills this pipeline is made of. lint-skills checks that this list and
# methodology/skills/*/ agree exactly, in both directions.
skills:
  - next
  - intake
  - refine
  - plan
  - implement
  - verify
  - review-close
  - answer-questions
  - retro

priorities:
  - name: critical
    rank: 1
  - name: high
    rank: 2
  - name: medium
    rank: 3
  - name: low
    rank: 4

# When an engagement ends. E1-E3 and E4 by withdrawal are triggered by REST, which
# scripts/engagement-state decides. E4 by SILENCE is triggered by the count below, and the
# threshold lives here rather than in any one program because three consumers read it - the
# orchestrator, engagement-state and check-epic-signoff - and any two of them disagreeing about
# whether it is met is F-045's mechanism exactly (spec/ids-and-statuses.md section 3.5a,
# ADR-0011 section 1.3).
#
# The rate at which rounds accrue is set by whoever runs the loop and NO PROGRAM CAN CHECK IT:
# three passes in a minute are three rounds, and the mechanism cannot tell them from three passes
# in three days. That is the honest cost of counting asks instead of time, and this file is where
# the calibration is written down. Raise the threshold if this workspace's loop runs fast.
termination:
  silence:
    threshold_rounds: 3
    unit: One orchestrator halt on the human with no inbound change since the previous halt. Recorded as a row in tracker/waiting/EP-###.md; the count is the trailing run of equal inbound digests, never a stored counter (spec/workspace-layout.md section 1.4). A halt requires an OUTSTANDING ASK - addressed-to human, blocking, with an empty Answer - and a pass with nothing else to do; a question that does not stop the loop never produces a round (ADR-0012 sections 1 and 3).
    inbound: Only what a stakeholder can change - a reply written into a question's Answer section, and a file under tracker/requests/. Nothing a skill writes is inbound.
    resets_on: Any inbound change - a full reply, a partial reply, a deferral, or a new request. The count measures PRESENCE rather than compliance - a slow stakeholder is never abandoned, an absent one is.
    declared_by: review-close, and only review-close. The orchestrator reads the verdict; it decides nothing (ADR-0011 section 5).

# Every status. `owner` is the single skill the orchestrator dispatches for an item in this
# status; `null` means no skill advances it and the orchestrator reports it instead.
#
# `terminal` and `suspendable` are two different questions, and conflating them cost a run
# (F-013). `terminal` answers "does the pipeline advance an item out of this status by itself?"
# — an epic at `open` advances only through its children, so it is terminal in that sense.
# `suspendable` answers "may a blocking question or an impasse suspend an item here?" — and an
# epic-level question is exactly the case that must be able to. `done` and `blocked` are neither.
statuses:
  - name: draft
    applies_to: [work-item, bug]
    owner: refine
    terminal: false
    suspendable: true
    description: Created, not yet proven to meet the Definition of Ready.

  - name: ready
    applies_to: [work-item, bug]
    owner: plan
    terminal: false
    suspendable: true
    description: Meets the Definition of Ready. Needs a design and a plan.

  - name: planned
    applies_to: [work-item, bug]
    owner: implement
    terminal: false
    suspendable: true
    description: A plan exists. No branch or code yet, so restarting is free.

  - name: in-progress
    applies_to: [work-item, bug]
    owner: implement
    terminal: false
    suspendable: true
    description: A branch exists with partial work. Resuming must reconcile with it.

  - name: verifying
    applies_to: [work-item, bug]
    owner: verify
    terminal: false
    suspendable: true
    description: Implementation reports itself complete. Needs independent validation.

  - name: in-review
    applies_to: [work-item, bug]
    owner: review-close
    terminal: false
    suspendable: true
    description: Verified. Needs Definition of Done review, merge, and closing.

  - name: awaiting-answer
    applies_to: [work-item, bug, epic]
    owner: answer-questions
    terminal: false
    suspendable: false
    description: A blocking question is open. No engineering may proceed.

  - name: blocked
    applies_to: [work-item, bug, epic]
    owner: null
    terminal: true
    suspendable: false
    description: A documented impasse. Only a human can move it. On an epic this is the impasse ENDING of the engagement, reached only through review-close and only after the stakeholder was asked.

  - name: open
    applies_to: [epic]
    owner: null
    terminal: true
    suspendable: true
    description: The engagement is running. Advances only through its children - except when scripts/engagement-state reports at-rest or abandoned, when the orchestrator dispatches review-close on the epic to end it (spec/ids-and-statuses.md sections 3.5 and 3.5a). A blocking question or an impasse may suspend it.

  - name: done
    applies_to: [work-item, bug, epic]
    owner: null
    terminal: true
    suspendable: false
    description: Closed, with an outcome recorded.

# Every legal transition. `from: null` means item creation. `from: any-suspendable` means any
# status whose `suspendable` is true — including an epic's `open`. `resume_to` records whether
# the transition must carry the status it suspends (see spec/ids-and-statuses.md §4).
#
# `applies_to` scopes a row to item types; a row without it applies to all of them. It is what
# makes "only review-close ends an engagement" expressible — the generic impasse row below is a
# work-item rule, and an epic's impasse is its own row with its own actor (ADR-0006 §2).
#
# `gated: true` means a skill's hard gates REFUSE this move, not merely report on it.
# `scripts/transition` otherwise blocks only the move to the actor's own `next_status`, because
# trapping a skill that is escaping downward — filing a question, sending an item back — is worse
# than letting it move. An epic has no downward escape: it advances only through its children, so
# every terminal move it makes declares the engagement finished and must be refused while the
# termination gate fails (ADR-0006 §1c; F-045).
#
# `provenance` on a creation row states what the creating skill must record in the new item's
# `arose-from`. The authority table is only enforceable if the claim is checkable
# (spec/ids-and-statuses.md §5; F-029, F-042).
transitions:
  - from: null
    to: draft
    actor: intake
    applies_to: [work-item]
    resume_to: forbidden
    provenance: The vision it refined, or the request R-### it was routed.
    condition: Item created from a refined idea under an epic, or from a routed stakeholder request.

  - from: null
    to: draft
    actor: refine
    applies_to: [work-item]
    resume_to: forbidden
    provenance: The item it split, as arose-from.
    condition: Definition of Ready R9 - the item under refinement is two items, and this is one of the parts.

  - from: null
    to: draft
    actor: answer-questions
    applies_to: [work-item]
    resume_to: forbidden
    provenance: The question whose answer widened the scope, as arose-from ITEM/Q-###.
    condition: An answer widened the scope and implied work no item records.

  - from: null
    to: ready
    actor: verify
    applies_to: [bug]
    resume_to: forbidden
    provenance: The item the defect was found against, as arose-from; and found-in where known.
    condition: A bug filed with reproduction steps already satisfies the bug Definition of Ready.

  - from: null
    to: ready
    actor: review-close
    applies_to: [bug]
    resume_to: forbidden
    provenance: The item under review when the defect was found, as arose-from; and found-in where known.
    condition: Review found a defect belonging to another item, which this item's send-back cannot carry.

  - from: null
    to: open
    actor: intake
    applies_to: [epic]
    resume_to: forbidden
    provenance: The vision it refined.
    condition: Epic created from the raw idea.

  - from: draft
    to: ready
    actor: refine
    applies_to: [work-item, bug]
    gated: true
    resume_to: forbidden
    condition: Definition of Ready passes, or the human explicitly overrides.

  - from: ready
    to: planned
    actor: plan
    applies_to: [work-item, bug]
    gated: true
    resume_to: forbidden
    condition: Design recorded and plan.md written, carrying the invalidation set, the deliverable documents and the binding ADRs the later stages consume - implement discharges the set, verify decides each ADR, review-close confirms against both (spec/dor-dod.md D7, D13).

  - from: planned
    to: in-progress
    actor: implement
    applies_to: [work-item, bug]
    resume_to: forbidden
    condition: Branch created and work started.

  - from: in-progress
    to: verifying
    actor: implement
    applies_to: [work-item, bug]
    gated: true
    resume_to: forbidden
    condition: Hard gates pass, impl-report.md is written, and every entry in the plan's invalidation set carries a disposition - the documents this change made false are repaired, still true, owned by the ending, or a question.

  - from: verifying
    to: in-review
    actor: verify
    applies_to: [work-item, bug]
    gated: true
    resume_to: forbidden
    condition: Every acceptance criterion is confirmed with evidence, every ADR the plan named as binding carries a conformance verdict, and every entry of the invalidation set is disposed.

  - from: verifying
    to: in-progress
    actor: verify
    applies_to: [work-item, bug]
    resume_to: forbidden
    condition: Verification fails against this item's own acceptance criteria.

  - from: in-review
    to: done
    actor: review-close
    applies_to: [work-item, bug]
    gated: true
    resume_to: forbidden
    condition: Definition of Done passes and the branch is merged into the trunk.

  - from: in-review
    to: in-progress
    actor: review-close
    applies_to: [work-item, bug]
    resume_to: forbidden
    condition: Review rejects the change, with the reasons recorded in review.md.

  - from: open
    to: done
    actor: review-close
    applies_to: [epic]
    gated: true
    resume_to: forbidden
    condition: The engagement ended at E1, E2 or E4 - every child is terminal, the epic Definition of Done passes, the stakeholder answered the termination question, and every Engagement state section in the workspace was restated afterwards from the ending being recorded (spec/dor-dod.md DE4).

  - from: open
    to: blocked
    actor: review-close
    applies_to: [epic]
    gated: true
    resume_to: required
    condition: The engagement ended at E3 - the impasse. Every child is terminal, at least one did not deliver, the stakeholder was asked and did not accept, and every Engagement state section was restated afterwards from the ending being recorded (spec/dor-dod.md DE4).

  - from: awaiting-answer
    to: done
    actor: review-close
    applies_to: [epic]
    gated: true
    resume_to: forbidden
    condition: The engagement ended at E4 by SILENCE while the epic was suspended - the sign-off was filed and the threshold was reached before it was answered. Only answer-questions may otherwise leave awaiting-answer, and it has nothing to answer. Gated for the same reason as the other two epic endings - an epic has no downward escape (ADR-0006 section 1c).

  - from: done
    to: open
    actor: any
    applies_to: [epic]
    resume_to: forbidden
    condition: A child item was filed against the epic after it closed - a defect in what it delivered, or work routed from a stakeholder request that arrived after the ending - so the goal is no longer met. This is the returning stakeholder's route back after E4 (spec/ids-and-statuses.md sections 3.4 and 3.5a). The reopening row records which item reopened it.

  - from: any-suspendable
    to: awaiting-answer
    actor: any
    resume_to: required
    condition: A blocking question was filed against the item.

  - from: awaiting-answer
    to: resume-to
    actor: answer-questions
    resume_to: forbidden
    condition: The blocking question is answered and its consequences are propagated into artifacts.

  - from: awaiting-answer
    to: blocked
    actor: answer-questions
    applies_to: [work-item, bug]
    resume_to: required
    condition: The answer was deferred - the stakeholder replied "not yet" and no decision can be taken without the missing thing (spec/question.md section 2).

  - from: awaiting-answer
    to: blocked
    actor: review-close
    applies_to: [work-item, bug]
    resume_to: required
    condition: E4 - an orphan suspended on a question that will never be answered, moved to blocked before the epic closes, with a history reason beginning "orphaned by E4:" and NO outcome at all. awaiting-answer is not suspendable, so the generic impasse row cannot reach it, and the deferral row above needs a reply that is not coming - F-050's shape, found by derivation rather than by a run (spec/ids-and-statuses.md section 3.5a).

  - from: any-suspendable
    to: blocked
    actor: any
    applies_to: [work-item, bug]
    resume_to: required
    condition: A documented impasse that no skill can resolve. An epic's impasse is its own row - only review-close ends an engagement.

  - from: blocked
    to: resume-to
    actor: any
    resume_to: forbidden
    condition: A human recorded a resolution in the item.

# Rules the workspace validator enforces by requiring an item to be at one of a fixed set of
# statuses. Each entry names the rule's code, the item types it applies to, and the transition
# that must be legal for those types if the rule is to be satisfiable at all.
#
# This block exists because a rule of exactly that shape was written for every item type while
# the transition that satisfies it was scoped to two of them: marking an epic-level question
# `deferred` required the epic to be at `blocked`, and no legal move could put it there, because
# an epic reaches `blocked` only as the E3 impasse ending through `review-close` (F-050). That
# is F-013's shape in the toolkit's own work, and it was written in the same session as the
# derivation that exists to prevent it — so "enumerate the item types a rule applies to" is a
# gate here rather than a habit.
#
# It is load-bearing in both directions. `scripts/validate-workspace` reads `applies_to` from
# here rather than deciding for itself which item types a status rule constrains, and reports
# `pipeline.obligation.missing` when an obligation it depends on is absent.
# `scripts/lint-skills` checks each entry against the transition table: an obligation naming a
# transition no row provides is `obligation.unsatisfiable`, and a scope the transitions do not
# permit is `obligation.applies_to.mismatch` — F-050 in one direction, F-013 in the other.
rule_obligations:
  - code: question.deferred.not-blocked
    applies_to: [work-item, bug]
    from: awaiting-answer
    to: blocked
    actor: answer-questions
    rationale: A deferred blocking question parks its item at blocked with what would unblock it recorded. An epic is not parked by a deferral - a deferred acknowledgment is the E3 impasse and only review-close ends an engagement (ADR-0006 section 2, F-050).

  - code: question.blocking.not-suspended
    applies_to: [work-item, bug, epic]
    from: any-suspendable
    to: awaiting-answer
    actor: any
    rationale: An open blocking question suspends its item, and an epic-level question is exactly the case that must be able to suspend an epic (F-013).

  # A rule that MANY moves satisfy. The two entries above each name one move; this one cannot,
  # because it demands a status of every child whatever status the child is at. Registering a
  # single triple for it would have been a false statement in a table validate-workspace reads
  # as scope, so the shape grew instead: `from` and `to` name CLASSES of status, and
  # `satisfied_by` enumerates the concrete pairs that deliver them for the actor that has to
  # deliver them. lint-skills then checks COVERAGE - every non-terminal status of every declared
  # item type must have a listed move out of it, made by review-close or by any skill.
  #
  # This is the check that would have caught the hole ADR-0011 found by derivation: an orphan
  # suspended at awaiting-answer had no move to a terminal status available to review-close,
  # because the only awaiting-answer -> blocked row belonged to answer-questions and needed a
  # reply that was never coming. Delete the review-close row above and this entry strands
  # awaiting-answer, which is F-050's shape and is proved by execution in scripts/check step 11.
  - code: epic.closed-with-active-children
    applies_to: [work-item, bug]
    from: any-non-terminal
    to: terminal
    actor: review-close
    satisfied_by:
      - from: any-suspendable
        to: blocked
      - from: awaiting-answer
        to: blocked
      - from: in-review
        to: done
    rationale: An epic may not close over a child still in flight, so before the ending review-close must be able to bring every child to a terminal status from wherever it is - which at E4 is every orphan at once (spec/ids-and-statuses.md sections 3.5 and 3.5a, Definition of Done DE1).

# The orchestrator's algorithm, in order. `next` executes exactly these steps and stops at the
# first one that produces an action. Nothing here requires engineering judgement, by design.
orchestrator:
  steps:
    - id: 1
      action: validate
      description: Run the workspace validator. If it fails, report and stop; a broken workspace makes every later step unsound.
    - id: 2
      action: route-stakeholder-requests
      description: If any request under tracker/requests/ has status open, dispatch intake on the oldest one and stop. The stakeholder speaking outranks selecting work; a request handled after the current item finishes is a request answered against a plan they already tried to change.
    - id: 3
      action: dispatch-answer-questions
      description: Else if any question is ANSWERABLE - addressed to architect, or addressed to human with its Answer section filled in - dispatch answer-questions on the item owning the oldest such question. The second shape is not new work for that skill; it is answer-questions' own precondition 1, which next never learned, so a reply the stakeholder had already written looked like a reason to stop and show it to them again (F-011, F-109).
    - id: 4
      action: dispatch-owner
      description: Else pick the runnable item with the best selection key and dispatch its status owner. This sits ABOVE the halt, which is the whole of F-097's fix - the loop lets every runnable item state its own questions, one pass and one journal entry at a time, before it stops on the person, so one round trip carries them all. No pass dispatches twice and no judgement about what could be asked enters the scheduler (ADR-0012 section 2).
    - id: 5
      action: surface-human-questions
      description: Else, if any OUTSTANDING ASK exists - a question with addressed-to human, blocking true and an empty Answer - the pipeline is waiting on a person and has nothing else to do. FIRST record the halt - one row on tracker/waiting/EP-###.md for each epic this halt is against - because a pass that read the count first would decide on a picture that excludes itself and the declaring pass would go unrecorded. THEN run scripts/engagement-state EP-### for each epic not already ended. If any reports abandoned, dispatch review-close on that epic and stop - the threshold was reached and the ending is E4 by silence. Otherwise surface every open human-addressed question in full - standing asks included, because a halt shows the person everything - with its item and the round count against the threshold, and stop. A standing ask is surfaced and never causes a halt - blocking false means nothing waits on it, and the loop that waited on it anyway put every ending out of reach (F-104). next decides nothing here - it reads a verdict, exactly as at steps 6 and 7 (spec/ids-and-statuses.md section 3.5a, ADR-0011 section 5, ADR-0012 section 1).
    - id: 6
      action: end-the-engagement
      description: Else, for each epic still at open, run scripts/engagement-state EP-###. If it reports at-rest, dispatch review-close on that epic and stop. This step is reachable because rest and the halt are complementary - an engagement at rest has no outstanding ask, so it falls past step 5 rather than being held there by a question nobody is waiting on (ADR-0012 section 4). Abandonment is not reached here - it is declared at step 3, where the halt is (spec/ids-and-statuses.md section 3.5a). An engagement that can no longer progress must be ended through the stakeholder, not left on the board - which is what happened in a run that stopped here with the stakeholder recording that nobody ever asked them (F-045). The step terminates because both of review-close's moves from open leave open.
    - id: 7
      action: retro-an-ended-engagement
      description: Else, for each epic whose scripts/engagement-state verdict is ended - the ending is recorded and the retrospective is not written - dispatch retro on that epic and stop. The stakeholder is not waiting on this; their engagement ended at sign-off. This step terminates because writing the report changes the verdict to closed (ADR-0009 section 2).
    - id: 8
      action: report-and-stop
      description: Else regenerate the board, report it with any blocked items and open non-blocking questions, and stop.

  # An item is runnable when all of these hold.
  runnable:
    - Its status has a non-null owner.
    - It has no open blocking question. A deferred question is not open - the person replied, and their reply was "not yet" (spec/question.md section 2). Neither is an abandoned one - nobody replied, and no item resumes on the strength of it.
    - Every id in its depends-on is at status done.

  # Deterministic and total: two runs over the same workspace pick the same item.
  selection_key:
    - priority-rank ascending
    - created ascending
    - id ascending

  stop_conditions:
    - The workspace validator failed.
    - An open stakeholder request was routed to intake.
    - An outstanding ask is open, nothing else was dispatchable, the halt was recorded, and every open human-addressed question was surfaced.
    - An outstanding ask is open, nothing else was dispatchable, the halt was recorded, and scripts/engagement-state reported abandoned, so review-close was dispatched to declare E4 by silence.
    - No item is runnable, and review-close was dispatched to end an engagement at rest.
    - No item is runnable, and retro was dispatched on an engagement that has ended.
    - No item is runnable and every engagement is closed - ended, with its retrospective written.
